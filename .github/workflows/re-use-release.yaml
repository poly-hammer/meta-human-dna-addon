name: Re-Useable Release
on:
  workflow_call:
    inputs:
      python-version:
        required: true
        type: string
      environment:
        default: "staging"
        required: true
        type: string
    secrets:
      GH_PAT:
        required: true

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6
        with:
          lfs: true
          submodules: false
          token: ${{ secrets.GH_PAT }}

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"

      - name: Install Dependencies
        run: uv sync

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Create Release
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          ADDONS_FOLDER: src/addons
          RELEASES_FOLDER: releases
          BLENDER_VERSION: "4.5"
          BLENDER_EXTENSION_SERVER_S3_BUCKET: ${{ inputs.environment == 'prod' && 'poly-hammer-portal-prod-app-data' || 'poly-hammer-portal-staging-app-data' }}
          BLENDER_EXTENSION_SERVER_S3_FOLDER: products/blender-extensions/meta_human_dna
        run: uv run python -m poly_hammer_utils.extension.meta_human_dna
