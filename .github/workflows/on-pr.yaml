name: Dev Checks
on:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/**.yaml"
      - "!src/**/release_notes.md"
      - "pyproject.toml"
      - "cspell.json"
      - ".pre-commit-config.yaml"

jobs:
  lint:
    name: Lint & Static Analysis
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-lint.yaml@main
    secrets: inherit
    with:
      python-version: "3.11"

  # Test with Blender 4.5
  test-blender-4-5-ubuntu-latest:
    needs: [lint]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "ubuntu-latest"
      addon-id: "character_dna"
      base: "character-dna"

  test-blender-4-5-windows-latest:
    needs: [lint]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "windows-latest"
      addon-id: "character_dna"
      base: "character-dna"

  test-blender-4-5-macos-latest:
    needs: [lint]
    name: Blender 4.5 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "macos-latest"
      addon-id: "character_dna"
      base: "character-dna"

  # Test with Blender 5.1
  test-blender-5-1-ubuntu-latest:
    needs: [test-blender-4-5-ubuntu-latest]
    name: Blender 5.1 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"
      blender-version: "5.1"
      runner-os: "ubuntu-latest"
      addon-id: "character_dna"
      base: "character-dna"

  test-blender-5-1-windows-latest:
    needs: [test-blender-4-5-windows-latest]
    name: Blender 5.1 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"
      blender-version: "5.1"
      runner-os: "windows-latest"
      addon-id: "character_dna"
      base: "character-dna"

  test-blender-5-1-macos-latest:
    needs: [test-blender-4-5-macos-latest]
    name: Blender 5.1 Tests
    uses: poly-hammer/poly-hammer-workflows/.github/workflows/re-use-blender-tests.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"
      blender-version: "5.1"
      runner-os: "macos-latest"
      addon-id: "character_dna"
      base: "character-dna"

  benchmark-blender-4-5:
    needs: [test-blender-5-1-ubuntu-latest, test-blender-5-1-windows-latest, test-blender-5-1-macos-latest]
    name: Blender 4.5 Benchmark
    uses: poly-hammer/meta-human-dna-addon/.github/workflows/re-use-benchmark.yaml@main
    secrets: inherit
    with:
      python-version: "3.11"
      blender-version: "4.5"
      runner-os: "ubuntu-latest"
      iterations: 50
      warmup: 10
      threshold: 15
      is-push: ${{ github.event_name == 'push' }}
      is-pull-request: ${{ github.event_name == 'pull_request' }}

  benchmark-blender-5-1:
    needs: [test-blender-5-1-ubuntu-latest, test-blender-5-1-windows-latest, test-blender-5-1-macos-latest]
    name: Blender 5.1 Benchmark
    uses: poly-hammer/meta-human-dna-addon/.github/workflows/re-use-benchmark.yaml@main
    secrets: inherit
    with:
      python-version: "3.13"
      blender-version: "5.1"
      runner-os: "ubuntu-latest"
      iterations: 50
      warmup: 10
      threshold: 15
      is-push: ${{ github.event_name == 'push' }}
      is-pull-request: ${{ github.event_name == 'pull_request' }}
